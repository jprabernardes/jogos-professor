<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B4FA0">
<title>O Caso Laura</title>
<meta name="description" content="Escape room em 5 estações – Farmacologia: anti-inflamatórios, anticoagulantes e anticoncepcionais">
<style>
:root{
  --bg:#E8EBEF; --card:#FFFFFF; --ink:#1E2230; --muted:#5B6274; --line:#CDD3DB;
  --foil:#D3D9E1; --foil-2:#BCC4CF;
  --violet:#6B4FA0; --violet-soft:#EEE8F7; --teal:#1F7F75; --teal-soft:#E1F2EF;
  --red:#B3261E; --red-soft:#FBE8E6; --amber:#8A5A00; --amber-soft:#FFF2D2; --focus:#2457B8;
  --round:"SF Pro Rounded",ui-rounded,"Nunito","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14151B; --card:#1E2029; --ink:#ECEDF3; --muted:#9EA3B5; --line:#30333F;
    --foil:#2C303B; --foil-2:#3A3F4C;
    --violet:#B59BE8; --violet-soft:#2C2540; --teal:#5CC6BA; --teal-soft:#173430;
    --red:#F08A80; --red-soft:#3A1F1E; --amber:#E7B65C; --amber-soft:#3A2F15; --focus:#8AB4FF;
  }
}
:root[data-theme="dark"]{
  --bg:#14151B; --card:#1E2029; --ink:#ECEDF3; --muted:#9EA3B5; --line:#30333F;
  --foil:#2C303B; --foil-2:#3A3F4C;
  --violet:#B59BE8; --violet-soft:#2C2540; --teal:#5CC6BA; --teal-soft:#173430;
  --red:#F08A80; --red-soft:#3A1F1E; --amber:#E7B65C; --amber-soft:#3A2F15; --focus:#8AB4FF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);overflow-x:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
h1,h2{font-family:var(--round);font-weight:800;line-height:1.1;margin:0;letter-spacing:-.01em}
h1{font-size:40px} h2{font-size:26px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* HUD com cartela (blíster) */
.hud{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.hud .top{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:6px}
.timer{font:800 28px/1 var(--round);font-variant-numeric:tabular-nums;min-width:88px}
.timer.late{color:var(--red)}
.step{flex:1;font-size:14px;color:var(--muted);line-height:1.25}
.step b{display:block;color:var(--ink);font-size:16px}
.btn-hint{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:700}
.btn-hint:disabled{opacity:.4}
.blister{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:8px;margin:0 0 10px;border-radius:12px;background:linear-gradient(135deg,var(--foil),var(--foil-2))}
.pill{aspect-ratio:1/1.35;border-radius:50% / 40%;display:grid;place-items:center;font:800 15px var(--round);
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,255,255,.15) 45%),var(--violet);color:transparent;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.pill.final{background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,255,255,.15) 45%),var(--teal)}
.pill.out{background:var(--card);color:var(--violet);box-shadow:inset 0 2px 5px rgba(0,0,0,.25);animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.pill.out{animation:none}.shake{animation:none!important}}

main{padding:20px 0 32px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 20px}
.kicker{font-size:14px;color:var(--violet);font-weight:700;margin-bottom:4px}
.story{margin:12px 0}
.prompt{font-weight:650;margin:14px 0 12px}
table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 12px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
td.v{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
td.v.up::after{content:" ↑";color:var(--red)} td.v.down::after{content:" ↓";color:var(--red)}
ul.meds{margin:4px 0 12px;padding-left:20px} ul.meds li{margin-bottom:6px}

.choice{display:block;width:100%;text-align:left;min-height:52px;padding:12px 14px;margin:0 0 10px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.choice.sel{border-color:var(--violet);box-shadow:inset 0 0 0 1.5px var(--violet);background:var(--violet-soft)}
.choice .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--violet);color:var(--card);font-weight:800;font-size:14px;margin-right:8px}
.choice.used{opacity:.55}
.choice:disabled{cursor:default}
.colhead{font-size:14px;color:var(--muted);margin:14px 0 8px}
.pair-target{display:block;font-size:14px;color:var(--violet);margin-top:4px}

.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.key{min-height:64px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);display:flex;align-items:center;gap:8px;padding:10px 12px;text-align:left;font-weight:650}
.key svg{flex:none;width:28px;height:28px;color:var(--amber)}
.key.bad{opacity:.45;text-decoration:line-through}

.ws{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:8px 0 12px;touch-action:manipulation}
.ws button{aspect-ratio:1;min-height:32px;border:0;border-radius:8px;background:var(--bg);font:800 17px var(--round);padding:0}
.ws button.a{background:var(--amber-soft);box-shadow:inset 0 0 0 2px var(--amber)}
.ws button.f{background:var(--teal-soft);color:var(--teal)}
ol.clues{padding-left:20px;margin:0 0 8px} ol.clues li{margin-bottom:6px} ol.clues b{color:var(--teal);letter-spacing:.06em}

input.answer{width:100%;min-height:56px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);font-size:22px;font-weight:700;letter-spacing:.04em}
.primary{display:block;width:100%;min-height:56px;margin-top:14px;border:0;border-radius:16px;background:var(--violet);color:#fff;font-weight:800;font-size:18px}
:root[data-theme="dark"] .primary{color:#17121F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .primary{color:#17121F}}
.primary:disabled{opacity:.4}
.secondary{display:block;width:100%;min-height:48px;margin-top:10px;border:1.5px solid var(--line);border-radius:16px;background:transparent;font-weight:700}
.msg{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:15px}
.msg.err{background:var(--red-soft);border-left:4px solid var(--red)}
.msg.hint{background:var(--amber-soft);border-left:4px solid var(--amber)}
.msg.ok{background:var(--teal-soft);border-left:4px solid var(--teal)}
.letter{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--violet);color:#fff;font:800 24px var(--round);margin-right:10px;vertical-align:middle}
.riddle{margin:14px 0;padding:16px;border-radius:14px;background:var(--violet-soft);font-size:17px;line-height:1.55}
.senha{font:800 30px/1.1 var(--round);letter-spacing:.1em;color:var(--violet);text-align:center;padding:14px;border:2px dashed var(--violet);border-radius:14px;margin:10px 0}
.shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.intro{padding:28px 0 32px}
.intro .tag{color:var(--violet);font-weight:700;margin-bottom:8px}
.rules{margin:16px 0;padding:0;list-style:none}
.rules li{padding:10px 0;border-bottom:1px solid var(--line)}
label.lbl{display:block;font-weight:650;margin:18px 0 6px}
.code{font:800 44px/1.1 var(--round);letter-spacing:.08em;text-align:center;padding:18px 8px;border:2px dashed var(--violet);border-radius:16px;margin:12px 0;color:var(--violet)}
dl.stats{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:12px 0}
dl.stats dt{color:var(--muted)} dl.stats dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
footer{padding:8px 0 28px;font-size:13px;color:var(--muted);line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:9}
.modal .box{background:var(--card);border-radius:18px;padding:20px;max-width:420px;width:100%}
</style>
</head>

  return s.replace(/[^a-z0-9\-]/g,'');
}
function slow(lid,ans){ let h=sha(D.salt+lid+ans); for(let i=1;i<D.iter;i++) h=sha(h+D.salt); return h; }
function decKey(key,b64){
  const raw=atob(b64), out=new Uint8Array(raw.length); let i=0,c=0;
  while(i<raw.length){ const blk=sha(key+c); c++; for(let j=0;j<32&&i<raw.length;j++,i++) out[i]=raw.charCodeAt(i)^parseInt(blk.substr(j*2,2),16); }
  return JSON.parse(new TextDecoder().decode(out));
}
const dec=(lid,ans,b64)=>decKey(sha(D.salt+'k'+lid+ans),b64);

/* ---- Estado ---- */
const KEY='er-'+D.game, Q=new URLSearchParams(location.search), QE=+Q.get('e')||0, QK=Q.get('k')||'';
let S=null, ST=null; // ST = conteúdo decifrado da estação atual
function load(){ try{ const r=localStorage.getItem(KEY); if(r) S=JSON.parse(r);}catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const elapsed=()=> S.done ? S.doneAt : Math.floor((Date.now()-S.start)/1000);
const hintsUsed=()=>Object.keys(S.hints).length;
const totalTime=()=>elapsed()+hintsUsed()*60+(S.penalty||0);
const fmt=t=>{const a=Math.abs(t);return (t<0?'+':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0');};
const stKey=n=>{const g=S.keys[n]; return sha(D.salt+'sk'+n+g);};
function station(n){ return D.stations[n-1]; }
function openStation(n){ ST=decKey(stKey(n),station(n).blob); }

let timerOn=false;
function tick(){
  if(!S||S.done) return;
  const left=D.minutes*60-elapsed();
  $('timer').textContent=fmt(left); $('timer').classList.toggle('late',left<0);
  if(left<0 && !S.late){ S.late=true; save(); showModal('<h2>Tempo esgotado</h2><p style="margin-top:10px">Os '+D.minutes+' minutos acabaram. Vocês podem continuar até o fim para revisar o caso, mas o código vai indicar que terminaram fora do tempo.</p><button class="primary" type="button" onclick="hideModal()">Continuar</button>'); }
}
function startTimer(){ if(timerOn) return; timerOn=true; tick(); setInterval(tick,1000); }
function showModal(h){ $('modalBox').innerHTML=h; $('modal').classList.remove('hidden'); }
function hideModal(){ $('modal').classList.add('hidden'); }

function renderHud(label){
  $('hud').classList.remove('hidden');
  $('step').innerHTML=label+'<span>'+(hintsUsed()? hintsUsed()+(hintsUsed()>1?' dicas usadas':' dica usada'):'sem dicas usadas')+'</span>';
  let s='';
  for(let j=0;j<D.letters;j++){ const L=S.letters[j]; s+='<div class="pill'+(L?' out':'')+'">'+(L?esc(L):'')+'</div>'; }
  s+='<div class="pill final'+(S.done?' out':'')+'"></div>';
  $('blister').innerHTML=s;
  startTimer();
}

/* ---- Telas ---- */
function view(h){ $('view').innerHTML=h; window.scrollTo(0,0); }
function screenNoState(){
  view('<div class="intro"><p class="tag">Escape room de Farmacologia</p><h1>O caso Laura</h1><p class="story" style="margin-top:16px">Este celular ainda não começou o jogo.</p><p>Comecem pelo QR code que o professor mostrou em sala (estação 1) e usem <b>o mesmo celular</b> do começo ao fim.</p></div>');
}
function screenIntro(){
  view('<div class="intro"><p class="tag">Escape room de Farmacologia, 5 estações</p><h1>O caso Laura</h1>'+
  '<p class="story" style="margin-top:16px">Laura tem 24 anos e uma sequência de decisões ruins com medicamentos. Para acompanhar o caso até o fim, o grupo vai percorrer o campus: cada estação tem dois desafios e, no fim, entrega uma charada com o próximo local e a senha para abrir o próximo QR code.</p>'+
  '<ul class="rules"><li>São 5 estações com 2 desafios cada. Vocês têm <b>'+D.minutes+' minutos</b>.</li><li>Para abrir uma estação, é preciso ler o QR <b>no local</b> e digitar a senha da estação anterior.</li><li>Usem o mesmo celular do começo ao fim: o progresso fica salvo nele.</li><li>Cada dica soma 1 minuto ao tempo final. Errar não trava, mas os erros contam.</li><li>Cada desafio destaca um comprimido da cartela e revela uma letra. A última porta pede a palavra formada.</li></ul>'+
  '<label class="lbl" for="name">Nome completo de quem está com o celular</label><input class="answer" id="name" autocomplete="name" placeholder="Nome e sobrenome" style="font-size:18px;letter-spacing:0">'+
  '<label class="lbl" for="group">Integrantes do grupo (opcional)</label><input class="answer" id="group" placeholder="Ex.: Ana, Bruno, Carla" style="font-size:16px;letter-spacing:0">'+
  '<button class="primary" id="btnStart" type="button" disabled>Começar</button></div>');
  $('name').oninput=()=>{ $('btnStart').disabled=$('name').value.trim().split(/\s+/).filter(Boolean).length<2; };
  $('btnStart').onclick=()=>{
    const b=$('btnStart'); b.disabled=true; b.textContent='Abrindo…';
    setTimeout(()=>{
      const gate='|'+QK;
      if(slow('s1',gate)!==station(1).check){ b.textContent='Começar'; b.disabled=false; showModal('<h2>QR inválido</h2><p style="margin-top:10px">Leiam de novo o QR code da estação 1.</p><button class="primary" type="button" onclick="hideModal()">Ok</button>'); return; }
      S={name:$('name').value.trim().replace(/\s+/g,' '),group:$('group').value.trim(),start:Date.now(),stage:0,ch:0,keys:{1:gate},letters:[],hints:{},errors:0,penalty:0,late:false,done:false,next:null,ws:{},bad:{}};
      save(); route();
    },30);
  };
}
function screenGate(n){
  renderHud('<b>Estação '+n+' de 5</b>');
  view('<main><article class="sheet"><div class="kicker">Estação '+n+'</div><h2>Porta trancada</h2><p class="story">Vocês encontraram o QR certo. Digitem a senha recebida no fim da estação '+(n-1)+'.</p><input class="answer" id="pw" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Senha"><div id="fb"></div><button class="primary" id="btnPw" type="button" disabled>Abrir estação</button></article></main>');
  const i=$('pw'); i.oninput=()=>{$('btnPw').disabled=!i.value.trim();}; i.onkeydown=e=>{if(e.key==='Enter'&&i.value.trim())tryPw();};
  $('btnPw').onclick=tryPw;
  function tryPw(){
    const b=$('btnPw'); b.disabled=true; b.textContent='Verificando…';
    setTimeout(()=>{
      const gate=norm(i.value)+'|'+QK;
      if(slow('s'+n,gate)===station(n).check){ S.keys[n]=gate; S.ch=0; save(); route(); return; }
      b.textContent='Abrir estação'; b.disabled=false;
      $('fb').innerHTML='<div class="msg err">Senha incorreta para este QR. Confiram a senha da estação '+(n-1)+' e se este é o QR da estação '+n+'.</div>';
    },30);
  }
}
function screenTravel(){
  const n=S.stage+1, nx=S.next||{};
  renderHud('<b>A caminho da estação '+n+'</b>');
  view('<main><article class="sheet" style="border-color:var(--teal)"><div class="kicker" style="color:var(--teal)">Estação '+S.stage+' concluída</div><h2>Próximo destino</h2>'+
    '<div class="riddle">'+esc(nx.riddle||'')+'</div><p class="muted" style="margin:0">Senha da estação '+n+'</p><div class="senha">'+esc(nx.senha||'')+'</div>'+
    '<p>Encontrem o local, leiam o QR code da estação '+n+' com a câmera e digitem essa senha. O cronômetro continua correndo.</p>'+
    (QE===n? '<button class="primary" id="btnHere" type="button">Estamos aqui: abrir estação '+n+'</button>':'')+
    '</article></main>');
  if($('btnHere')) $('btnHere').onclick=()=>screenGate(n);
}

/* ---- Desafio ---- */
let sel=null, seq=[], pairs={}, activeLeft=null, wsA=null;
function curCh(){ return ST.challenges[S.ch]; }
function hudLabel(){ return '<b>Estação '+(S.stage+1)+' de 5</b>Desafio '+(S.ch+1)+' de 2 · '; }
function screenChallenge(){
  const n=S.stage+1, L=curCh(); sel=null; seq=[]; pairs={}; activeLeft=null; wsA=null;
  renderHud('<b>Estação '+n+' de 5, desafio '+(S.ch+1)+' de 2</b>');
  $('btnHint').disabled=!!S.hints[L.id];
  let h='<main><article class="sheet" id="sheet"><div class="kicker">Estação '+n+': '+esc(ST.title)+'</div><h2>'+esc(L.title)+'</h2>';
  if(S.ch===0) h+='<p class="story">'+esc(ST.intro)+'</p>';
  h+='<p class="story">'+esc(L.story)+'</p>';
  if(L.report) h+='<table><thead><tr><th>Exame</th><th>Resultado</th><th>Referência</th></tr></thead><tbody>'+L.report.map(r=>'<tr><td>'+esc(r[0])+'</td><td class="v '+r[3]+'">'+esc(r[1])+'</td><td class="muted">'+esc(r[2])+'</td></tr>').join('')+'</tbody></table>';
  if(L.meds) h+='<ul class="meds">'+L.meds.map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul>';
  if(L.type==='final') h+='<p>Letras coletadas: <b style="letter-spacing:.2em">'+esc(S.letters.join(' '))+'</b></p>';
  h+='<p class="prompt">'+esc(L.prompt)+'</p><div id="area"></div>';
  h+='<div id="hintBox">'+(S.hints[L.id]?'<div class="msg hint"><b>Dica:</b> '+esc(L.hint)+'</div>':'')+'</div><div id="fb"></div>';
  if(L.type!=='keys'&&L.type!=='wordsearch') h+='<button class="primary" id="btnGo" type="button" disabled>Abrir cadeado</button>';
  h+='</article></main>';
  view(h); drawArea(); if($('btnGo')) $('btnGo').onclick=submit;
}
function drawArea(){
  const L=curCh(), a=$('area'); let h='';
  if(L.type==='text'||L.type==='final'){
    a.innerHTML='<input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="'+(L.inputmode||'text')+'" placeholder="'+esc(L.placeholder||'')+'">';
    const i=$('ans'); i.oninput=()=>{$('btnGo').disabled=!i.value.trim();}; i.onkeydown=e=>{if(e.key==='Enter'&&i.value.trim())submit();}; return;
  }
  if(L.type==='mc'){
    a.innerHTML=L.options.map((o,k)=>'<button type="button" class="choice'+(sel===o.id?' sel':'')+'" data-id="'+o.id+'"><span class="n">'+'ABCD'[k]+'</span>'+esc(o.t)+'</button>').join('');
    a.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{sel=b.dataset.id; drawArea(); $('btnGo').disabled=false;}); return;
  }
  if(L.type==='keys'){
    const bad=S.bad[L.id]||[];
    const ico='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7.5" cy="12" r="4"/><path d="M11.5 12H21M17 12v3M20 12v2"/></svg>';
    a.innerHTML='<div class="keys">'+L.options.map(o=>'<button type="button" class="key'+(bad.includes(o.id)?' bad':'')+'" data-id="'+o.id+'"'+(bad.includes(o.id)?' disabled':'')+'>'+ico+esc(o.t)+'</button>').join('')+'</div>';
    a.querySelectorAll('.key').forEach(b=>b.onclick=()=>tryKey(b.dataset.id)); return;
  }
  if(L.type==='order'){
    h='<p class="colhead">Toquem para adicionar ou remover da sequência</p>'+L.cards.map(c=>{const p=seq.indexOf(c.id);return '<button type="button" class="choice'+(p>=0?' sel':'')+'" data-id="'+c.id+'">'+(p>=0?'<span class="n">'+(p+1)+'</span>':'')+esc(c.t)+'</button>';}).join('');
    h+=seq.length?'<button type="button" class="secondary" id="clr">Limpar sequência</button>':'';
    a.innerHTML=h;
    a.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const id=b.dataset.id,p=seq.indexOf(id); if(p>=0) seq.splice(p,1); else seq.push(id); drawArea();});
    if($('clr')) $('clr').onclick=()=>{seq=[];drawArea();};
    $('btnGo').disabled=seq.length!==L.cards.length; return;
  }
  if(L.type==='assoc'){
    const used=Object.values(pairs);
    h='<p class="colhead">1. Escolham o fármaco</p>'+L.left.map((t,k)=>{const r=L.right.find(x=>x.id===pairs[k]);return '<button type="button" class="choice'+(activeLeft===k?' sel':'')+'" data-l="'+k+'"><b>'+esc(t)+'</b>'+(r?'<span class="pair-target">→ '+esc(r.t)+'</span>':'')+'</button>';}).join('');
    h+='<p class="colhead">2. Toquem na característica'+(activeLeft!==null?' de <b>'+esc(L.left[activeLeft])+'</b>':'')+'</p>'+L.right.map(r=>'<button type="button" class="choice'+(used.includes(r.id)?' used':'')+'" data-r="'+r.id+'"'+(activeLeft===null?' disabled':'')+'>'+esc(r.t)+'</button>').join('');
    a.innerHTML=h;
    a.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{activeLeft=+b.dataset.l; drawArea();});
    a.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ if(activeLeft===null) return; const id=b.dataset.r;
      for(const k in pairs) if(pairs[k]===id) delete pairs[k];
      pairs[activeLeft]=id; const nx=L.left.findIndex((_,k)=>pairs[k]===undefined); activeLeft=nx>=0?nx:null; drawArea(); });
    $('btnGo').disabled=Object.keys(pairs).length!==L.left.length; return;
  }
  if(L.type==='wordsearch'){
    const found=S.ws[L.id]||{}, cells=new Set();
    Object.values(found).forEach(f=>f.c.forEach(x=>cells.add(x)));
    h='<div class="ws" role="grid">';
    for(let r=0;r<9;r++) for(let c=0;c<9;c++){ const id=r*9+c; h+='<button type="button" data-c="'+id+'" class="'+(cells.has(id)?'f':'')+(wsA===id?' a':'')+'" aria-label="linha '+(r+1)+' coluna '+(c+1)+'">'+L.grid[r][c]+'</button>'; }
    h+='</div><ol class="clues">'+L.clues.map((t,i)=>'<li>'+esc(t)+(found[i]?' <b>'+esc(found[i].w.toUpperCase())+'</b>':'')+'</li>').join('')+'</ol>';
    h+='<p class="muted" style="font-size:14px">'+Object.keys(found).length+' de '+L.clues.length+' encontradas</p>';
    a.innerHTML=h;
    a.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>wsTap(+b.dataset.c)); return;
  }
}
function wsTap(id){
  const L=curCh();
  if(wsA===null){ wsA=id; drawArea(); return; }
  const r1=Math.floor(wsA/9),c1=wsA%9,r2=Math.floor(id/9),c2=id%9; wsA=null;
  const dr=Math.sign(r2-r1), dc=Math.sign(c2-c1), len=Math.max(Math.abs(r2-r1),Math.abs(c2-c1))+1;
  if(!(r1===r2||c1===c2||Math.abs(r2-r1)===Math.abs(c2-c1))||len<2){ drawArea(); return; }
  let w='', cs=[]; for(let i=0;i<len;i++){ const r=r1+dr*i,c=c1+dc*i; w+=L.grid[r][c]; cs.push(r*9+c); }
  w=w.toLowerCase(); const rw=w.split('').reverse().join('');
  const found=S.ws[L.id]=S.ws[L.id]||{}; let hit=false;
  for(const cand of [w,rw]){ const hh=sha(D.salt+L.id+'w'+cand); const i=L.wh.indexOf(hh); if(i>=0&&!found[i]){ found[i]={w:cand,c:cs}; hit=true; break; } }
  save(); drawArea();
  if(Object.keys(found).length===L.clues.length){
    const ans=L.clues.map((_,i)=>found[i].w).join('-');
    setTimeout(()=>{ if(slow(L.id,ans)===L.check) solved(L,ans); },50);
  }
}
function tryKey(id){
  const L=curCh(); $('fb').innerHTML='<div class="msg">Testando a chave…</div>';
  setTimeout(()=>{
    if(slow(L.id,id)===L.check){ solved(L,id); return; }
    S.errors++; S.penalty=(S.penalty||0)+30; (S.bad[L.id]=S.bad[L.id]||[]).push(id); save();
    $('fb').innerHTML='<div class="msg err"><b>+30 s.</b> '+esc(L.feedback)+'</div>'; drawArea();
    const sh=$('sheet'); sh.classList.remove('shake'); void sh.offsetWidth; sh.classList.add('shake');
  },30);
}
function currentAnswer(){
  const L=curCh();
  if(L.type==='text'||L.type==='final') return norm($('ans').value);
  if(L.type==='mc') return sel;
  if(L.type==='order') return seq.join('-');
  if(L.type==='assoc') return L.left.map((_,k)=>pairs[k]).join('-');
}
function submit(){
  const L=curCh(), ans=currentAnswer(); if(!ans) return;
  const btn=$('btnGo'); btn.disabled=true; btn.textContent='Verificando…';
  setTimeout(()=>{
    if(slow(L.id,ans)===L.check){ solved(L,ans); return; }
    btn.textContent='Abrir cadeado'; S.errors++; save();
    let extra='';
    if(L.parts){ let c=0; ans.split('-').forEach((p,k)=>{ if(sha(D.salt+L.id+'p'+k+':'+p)===L.parts[k]) c++; });
      extra='<b>'+c+' de '+L.parts.length+(L.type==='order'?' na posição certa.':' corretas.')+'</b> '; }
    $('fb').innerHTML='<div class="msg err">'+extra+esc(L.feedback)+'</div>';
    const sh=$('sheet'); sh.classList.remove('shake'); void sh.offsetWidth; sh.classList.add('shake');
    btn.disabled=false; $('fb').scrollIntoView({block:'nearest',behavior:'smooth'});
  },30);
}
function solved(L,ans){
  const r=dec(L.id,ans,L.secret);
  if(r.l) S.letters.push(r.l);
  const lastOfStation=S.ch===1, n=S.stage+1;
  if(L.type==='final'){ S.done=true; S.doneAt=Math.floor((Date.now()-S.start)/1000); S.finalText=r.u; save(); finish(); return; }
  if(lastOfStation){ S.stage=n; S.ch=0; S.next={riddle:r.riddle,senha:r.senha}; } else S.ch=1;
  save();
  renderHud('<b>Estação '+n+' de 5</b>');
  view('<main><article class="sheet" style="border-color:var(--teal)"><div class="kicker" style="color:var(--teal)">Cadeado aberto</div><h2>'+esc(L.title)+'</h2><div class="msg ok" style="margin-top:14px">'+(r.l?'<span class="letter">'+esc(r.l)+'</span>':'')+esc(r.u)+'</div><button class="primary" id="btnNext" type="button">'+(lastOfStation?'Ver o próximo destino':'Ir para o desafio 2')+'</button></article></main>');
  $('btnNext').onclick=route;
}

/* ---- Código e fim ---- */
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function initial(name){ const c=norm(name).replace(/[^a-z]/g,'')[0]; return c?c.toUpperCase():'X'; }
function makeCode(name,t,hints,errs,late){
  const ini=initial(name);
  const p=(Math.min(Math.floor(t/10),511)*256)+(Math.min(hints,7)*32)+(Math.min(errs,15)*2)+(late?1:0);
  const mask=parseInt(sha(D.secret+'m'+ini).slice(0,6),16)%131072;
  const mac=parseInt(sha(D.secret+'c'+ini+':'+p).slice(0,4),16)%8192;
  let v=(p^mask)*8192+mac, s='';
  for(let i=0;i<6;i++){ s=ALPH[v%32]+s; v=Math.floor(v/32); }
  return ini+'-'+s;
}
function finish(){
  $('hud').classList.add('hidden');
  const hints=hintsUsed(), total=S.doneAt+hints*60+(S.penalty||0), late=S.doneAt>D.minutes*60;
  const code=makeCode(S.name,total,hints,S.errors,late);
  view('<div style="padding:24px 0"><h1>'+(late?'Vocês saíram, fora do tempo':'Vocês escaparam!')+'</h1><p class="story">'+esc(S.finalText||'')+'</p>'+
   '<dl class="stats"><dt>Representante</dt><dd>'+esc(S.name)+'</dd>'+(S.group?'<dt>Grupo</dt><dd>'+esc(S.group)+'</dd>':'')+'<dt>Tempo final</dt><dd>'+fmt(total)+'</dd><dt>Dicas usadas</dt><dd>'+hints+'</dd><dt>Erros</dt><dd>'+S.errors+'</dd></dl>'+
   '<p style="margin-top:18px;font-weight:650">Código de verificação</p><div class="code" id="code">'+code+'</div>'+
   '<p class="muted" style="font-size:14px">Mostrem este código ao professor.</p>'+
   '<button class="primary" type="button" id="btnCopy">Copiar código</button>'+
   '<button class="secondary" type="button" id="btnReset">Jogar de novo</button></div>');
  $('btnCopy').onclick=()=>{ const ok=()=>{$('btnCopy').textContent='Copiado';};
    if(navigator.clipboard) navigator.clipboard.writeText(code).then(ok,()=>prompt('Copie:',code)); else prompt('Copie:',code); };
  $('btnReset').onclick=()=>{ showModal('<h2>Apagar resultado?</h2><p style="margin-top:10px">Seu código atual some deste celular. Anote ou mostre ao professor antes.</p><button class="primary" type="button" id="yes">Apagar e recomeçar</button><button class="secondary" type="button" onclick="hideModal()">Cancelar</button>');
    $('yes').onclick=()=>{ try{localStorage.removeItem(KEY);}catch(e){} location.href=location.pathname; }; };
}

/* ---- Roteador ---- */
$('btnHint').onclick=()=>{
  const L=ST&&curCh(); if(!L||S.hints[L.id]) return;
  showModal('<h2>Usar a dica?</h2><p style="margin-top:10px">A dica soma 1 minuto ao tempo final.</p><button class="primary" type="button" id="yesHint">Mostrar dica</button><button class="secondary" type="button" onclick="hideModal()">Agora não</button>');
  $('yesHint').onclick=()=>{ S.hints[L.id]=1; save(); hideModal(); $('hintBox').innerHTML='<div class="msg hint"><b>Dica:</b> '+esc(L.hint)+'</div>'; $('btnHint').disabled=true; };
};
function route(){
  ST=null; $('btnHint').disabled=true;
  if(!S){ if(QE===1&&QK) screenIntro(); else screenNoState(); return; }
  if(S.done){ finish(); return; }
  const n=S.stage+1;
  if(S.keys[n]){ openStation(n); screenChallenge(); return; }
  if(QE===n&&QK) { screenGate(n); return; }
  screenTravel();
}
load(); route();
</script>
