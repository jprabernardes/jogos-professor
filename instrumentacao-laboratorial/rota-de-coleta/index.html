<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A6C74">
<title>Rota de coleta</title>
<meta name="description" content="Escape room em 6 estações – Instrumentação Laboratorial e Biossegurança: revisão da 2ª prova">
<style>
:root{
  --bg:#DDE2DE; --card:#FFFFFF; --ink:#18302C; --muted:#4F625E; --line:#C3CCC8;
  --route:#0A6C74; --route-soft:#DDF0F0; --haz:#C2410C; --haz-soft:#FDE8DC;
  --ok:#2B7A3D; --ok-soft:#E1F1E3; --no:#B42318; --no-soft:#FCE7E5; --hint:#8A5300; --hint-soft:#FFF1D6; --focus:#1D4ED8;
  --on-route:#FFFFFF;
  --head:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A19; --card:#1A2422; --ink:#E5EEEC; --muted:#9BB0AB; --line:#2C3A37;
    --route:#4CC3CB; --route-soft:#15302F; --haz:#FF8A50; --haz-soft:#3A2219;
    --ok:#6CCB80; --ok-soft:#16301C; --no:#F28B82; --no-soft:#3B1D1B; --hint:#F0B85A; --hint-soft:#36290F; --focus:#8AB4FF;
    --on-route:#06201F;
  }
}
:root[data-theme="dark"]{
  --bg:#121A19; --card:#1A2422; --ink:#E5EEEC; --muted:#9BB0AB; --line:#2C3A37;
  --route:#4CC3CB; --route-soft:#15302F; --haz:#FF8A50; --haz-soft:#3A2219;
  --ok:#6CCB80; --ok-soft:#16301C; --no:#F28B82; --no-soft:#3B1D1B; --hint:#F0B85A; --hint-soft:#36290F; --focus:#8AB4FF;
  --on-route:#06201F;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
h1,h2{font-family:var(--head);font-stretch:condensed;font-weight:700;line-height:1.05;margin:0;letter-spacing:-.005em}
h1{font-size:44px} h2{font-size:28px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* HUD: a linha da rota */
.hud{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hud .top{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:4px}
.timer{font:700 30px/1 var(--head);font-stretch:condensed;font-variant-numeric:tabular-nums;min-width:84px}
.timer.late{color:var(--no)}
.step{flex:1;font-size:14px;color:var(--muted);line-height:1.25}
.step b{display:block;color:var(--ink);font-size:16px}
.btn-hint{min-height:44px;padding:0 16px;border-radius:22px;border:1.5px solid var(--hint);background:var(--hint-soft);color:var(--hint);font-weight:700}
.btn-hint:disabled{opacity:.4;cursor:default}
.route{position:relative;display:grid;grid-template-columns:repeat(6,1fr);margin:6px 0 2px;padding:0 2px}
.route::before{content:"";position:absolute;left:8.33%;right:8.33%;top:13px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 16px)}
.route .fill{position:absolute;left:8.33%;top:13px;height:6px;border-radius:3px;background:var(--route);transition:width .6s ease}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);line-height:1.1;text-align:center}
.stop i{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--card);border:3px solid var(--line);font-style:normal;font-weight:800;font-size:13px;z-index:1}
.stop.done i{background:var(--route);border-color:var(--route);color:var(--on-route)}
.stop.here i{border-color:var(--haz);color:var(--haz);box-shadow:0 0 0 0 var(--haz);animation:ping 1.8s ease-out infinite}
.stop.here{color:var(--ink);font-weight:700}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--haz) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.tags{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:6px 0 10px}
.tag{position:relative;height:30px;border-radius:5px 5px 5px 5px;border:1.5px dashed var(--line);display:grid;place-items:center;font:700 16px var(--head);color:var(--ink)}
.tag::before{content:"";position:absolute;top:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--line)}
.tag.on{border:1.5px solid var(--haz);background:var(--haz-soft);padding-top:5px}
.tag.on::before{background:var(--haz)}
@media (prefers-reduced-motion: reduce){.stop.here i{animation:none}.route .fill{transition:none}.shake{animation:none!important}}

main{padding:18px 0 28px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px 20px}
.sheet.okb{border-color:var(--ok)}
.kicker{font-size:14px;color:var(--route);font-weight:700;margin-bottom:4px}
.story{margin:12px 0;white-space:pre-line}
.prompt{font-weight:650;margin:14px 0 12px}

.choice{display:block;width:100%;text-align:left;min-height:52px;padding:12px 14px;margin:0 0 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.choice.sel{border-color:var(--route);box-shadow:inset 0 0 0 1.5px var(--route);background:var(--route-soft)}
.choice .n{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:13px;background:var(--route);color:var(--on-route);font-weight:800;font-size:14px;margin-right:8px;padding:0 6px}
.choice.used{opacity:.55}
.choice:disabled{cursor:default}
.choice.chk::before{content:"";display:inline-block;width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;margin-right:10px;vertical-align:-4px}
.choice.chk.sel::before{background:var(--haz);border-color:var(--haz);box-shadow:inset 0 0 0 3px var(--card)}
.colhead{font-size:14px;color:var(--muted);margin:14px 0 8px}
.pair-target{display:block;font-size:14px;color:var(--route);margin-top:4px}

.item{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.item p{margin:0 0 8px;font-weight:600}
.bins{display:flex;flex-wrap:wrap;gap:6px}
.bins button{flex:1 1 0;min-width:44px;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:800;font-size:15px;padding:0 6px}
.bins button.sel{background:var(--route);border-color:var(--route);color:var(--on-route)}
.bins.vf button{flex:0 0 64px}

.keys{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.key{min-height:72px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);display:flex;align-items:center;gap:8px;padding:10px 12px;text-align:left;font-weight:650;font-size:15px}
.key svg{flex:none;width:28px;height:28px;color:var(--hint)}
.key.bad{opacity:.45;text-decoration:line-through}
.tm{display:grid;gap:6px;margin:10px 0}
.tm .row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tm .t{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;font:700 24px var(--head);background:var(--bg);border:1.5px solid var(--line)}
.tm .g{background:var(--ok);color:#fff;border-color:var(--ok)}.tm .y{background:#B7791F;color:#fff;border-color:#B7791F}.tm .x{background:var(--muted);color:var(--card);border-color:var(--muted)}
.mem{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.mem button{min-height:76px;border-radius:12px;border:1.5px solid var(--line);color:transparent;font-weight:650;font-size:15px;padding:8px;
  background:repeating-linear-gradient(135deg,var(--route) 0 12px,color-mix(in srgb,var(--route) 80%,var(--card)) 12px 24px)}
.mem button.up{background:var(--card);color:var(--ink);border-color:var(--route)}
.mem button.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.ws{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:8px 0 12px;touch-action:manipulation}
.ws button{aspect-ratio:1;min-height:32px;border:0;border-radius:6px;background:var(--bg);font:700 18px var(--head);padding:0}
.ws button.a{background:var(--hint-soft);box-shadow:inset 0 0 0 2px var(--hint)}
.ws button.f{background:var(--route-soft);color:var(--route)}
ol.clues{padding-left:20px;margin:0 0 8px} ol.clues li{margin-bottom:6px} ol.clues b{color:var(--route);letter-spacing:.06em}

input.answer{width:100%;min-height:56px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);font-size:22px;font-weight:700;letter-spacing:.03em}
.primary{display:block;width:100%;min-height:56px;margin-top:14px;border:0;border-radius:12px;background:var(--route);color:var(--on-route);font-weight:800;font-size:18px}
.primary:disabled{opacity:.4;cursor:default}
.secondary{display:block;width:100%;min-height:48px;margin-top:10px;border:1.5px solid var(--line);border-radius:12px;background:transparent;font-weight:700}
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px}
.msg.err{background:var(--no-soft);border-left:4px solid var(--no)}
.msg.hint{background:var(--hint-soft);border-left:4px solid var(--hint)}
.msg.ok{background:var(--ok-soft);border-left:4px solid var(--ok);overflow:hidden}
.letter{display:inline-grid;place-items:center;width:46px;height:56px;border-radius:6px;background:var(--haz);color:#fff;font:700 28px var(--head);margin-right:10px;vertical-align:middle;padding-top:12px;position:relative;float:left}
.letter::before{content:"";position:absolute;top:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--card)}
.riddle{margin:14px 0;padding:16px;border-radius:12px;background:var(--route-soft);font-size:17px;line-height:1.55;border-left:5px solid var(--route)}
.senha{font:700 32px/1.1 var(--head);letter-spacing:.12em;color:var(--haz);text-align:center;padding:12px;border:2px dashed var(--haz);border-radius:12px;margin:8px 0 12px}
.place{font:700 26px/1.1 var(--head);color:var(--route);margin:8px 0}
.shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.intro{padding:28px 0 28px}
.intro .tagline{color:var(--haz);font-weight:700;margin-bottom:8px}
.intro h1{font-size:54px}
.rules{margin:16px 0;padding:0;list-style:none}
.rules li{padding:10px 0;border-bottom:1px solid var(--line)}
label.lbl{display:block;font-weight:650;margin:18px 0 6px}
.code{font:700 40px/1.1 var(--head);letter-spacing:.06em;text-align:center;padding:16px 8px;border:2px dashed var(--route);border-radius:12px;margin:12px 0;color:var(--route);word-break:break-all}
dl.stats{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:12px 0}
dl.stats dt{color:var(--muted)} dl.stats dd{margin:0;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
footer{padding:8px 0 28px;font-size:13px;color:var(--muted);line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:9}
.modal .box{background:var(--card);border-radius:14px;padding:20px;max-width:420px;width:100%}
</style>
</head>

function sha(str){
  const m=TE.encode(str), l=m.length, n=((l+9+63)>>6)<<6, b=new Uint8Array(n);
  b.set(m); b[l]=0x80; const bits=l*8; b[n-4]=bits>>>24; b[n-3]=bits>>>16; b[n-2]=bits>>>8; b[n-1]=bits;
  let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++)W[i]=(b[o+4*i]<<24)|(b[o+4*i+1]<<16)|(b[o+4*i+2]<<8)|b[o+4*i+3];
    for(let i=16;i<64;i++){const x=W[i-15],y=W[i-2];
      W[i]=(((x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3))+W[i-7]+((y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10))+W[i-16])|0;}
    let a=h0,c=h1,d=h2,e=h3,f=h4,g=h5,h=h6,k=h7;
    for(let i=0;i<64;i++){
      const t1=(k+((f>>>6|f<<26)^(f>>>11|f<<21)^(f>>>25|f<<7))+((f&g)^(~f&h))+K[i]+W[i])|0;
      const t2=(((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10))+((a&c)^(a&d)^(c&d)))|0;
      k=h;h=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0;}
    h0=(h0+a)|0;h1=(h1+c)|0;h2=(h2+d)|0;h3=(h3+e)|0;h4=(h4+f)|0;h5=(h5+g)|0;h6=(h6+h)|0;h7=(h7+k)|0;
  }
  return [h0,h1,h2,h3,h4,h5,h6,h7].map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
function norm(s){
  s=String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  let t=s.trim().replace(/,/g,'.');
  if(/^-?\d+(\.\d+)?$/.test(t)){ if(t.includes('.')) t=t.replace(/0+$/,'').replace(/\.$/,''); return t.replace(/^0+/,'')||'0'; }
  return s.replace(/[^a-z0-9\-]/g,'');
}
function slow(lid,ans){ let h=sha(D.salt+lid+ans); for(let i=1;i<D.iter;i++) h=sha(h+D.salt); return h; }
function decKey(key,b64){
  const raw=atob(b64), out=new Uint8Array(raw.length); let i=0,c=0;
  while(i<raw.length){ const blk=sha(key+c); c++; for(let j=0;j<32&&i<raw.length;j++,i++) out[i]=raw.charCodeAt(i)^parseInt(blk.substr(j*2,2),16); }
  return JSON.parse(new TextDecoder().decode(out));
}
const dec=(lid,ans,b64)=>decKey(sha(D.salt+'k'+lid+ans),b64);

/* ---- Estado ---- */
const NST=D.stations.length, SHORT=D.short;
const KEY='er-'+D.game, Q=new URLSearchParams(location.search), QE=+Q.get('e')||0, QK=Q.get('k')||'';
let S=null, ST=null;
function load(){ try{ const r=localStorage.getItem(KEY); if(r) S=JSON.parse(r);}catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const elapsed=()=> S.done ? S.doneAt : Math.floor((Date.now()-S.start)/1000);
const hintsUsed=()=>Object.keys(S.hints).length;
const totalTime=()=>elapsed()+hintsUsed()*60+(S.penalty||0);
const fmt=t=>{const a=Math.abs(t);return (t<0?'+':'')+String(Math.floor(a/60)).padStart(2,'0')+':'+String(a%60).padStart(2,'0');};
const stKey=n=>sha(D.salt+'sk'+n+S.keys[n]);
function station(n){ return D.stations[n-1]; }
function openStation(n){ ST=decKey(stKey(n),station(n).blob); }
function newState(name,stage,keys){
  return {name:name,start:Date.now(),stage:stage,ch:0,keys:keys,letters:[],hints:{},errors:0,penalty:0,late:false,done:false,next:null,ws:{},bad:{},doneSt:[],rev:{}};
}

let timerOn=false;
function tick(){
  if(!S||S.done) return;
  const left=D.minutes*60-elapsed();
  $('timer').textContent=fmt(left); $('timer').classList.toggle('late',left<0);
  if(left<0 && !S.late){ S.late=true; save(); showModal('<h2>Tempo esgotado</h2><p style="margin-top:10px">Os '+D.minutes+' minutos acabaram. Você pode continuar até o fim para revisar, mas o código vai indicar que terminou fora do tempo.</p><button class="primary" type="button" onclick="hideModal()">Continuar a rota</button>'); }
}
function startTimer(){ if(timerOn) return; timerOn=true; tick(); setInterval(tick,1000); }
function showModal(h){ $('modalBox').innerHTML=h; $('modal').classList.remove('hidden'); }
function hideModal(){ $('modal').classList.add('hidden'); }

function renderHud(label){
  $('hud').classList.remove('hidden');
  const hu=hintsUsed();
  const m=label.match(/^(<b>.*?<\/b>)(.*)$/)||[0,label,''];
  $('step').innerHTML=m[1]+'<span>'+(m[2]?m[2]+', ':'')+(hu? hu+(hu>1?' dicas usadas':' dica usada'):'sem dicas usadas')+'</span>';
  const done=S.doneSt||[], here=S.done?0:S.stage+1;
  const reach=S.done?NST:Math.max(here,1);
  let r='<div class="fill" style="width:'+((reach-1)/(NST-1)*83.34)+'%"></div>';
  for(let k=1;k<=NST;k++){ const c=done.indexOf(k)>=0?'done':(k===here?'here':''); r+='<div class="stop '+c+'"><i>'+(c==='done'?'✓':k)+'</i>'+esc(SHORT[k-1])+'</div>'; }
  $('route').innerHTML=r;
  let s=''; for(let j=0;j<D.letters;j++){ const L=S.letters[j]; s+='<div class="tag'+(L?' on':'')+'">'+(L?esc(L):'')+'</div>'; }
  $('tags').innerHTML=s;
  startTimer();
}

    const b=$('btnStart'); b.disabled=true; b.textContent='Abrindo…';
    setTimeout(()=>{
      const gate='|'+QK;
      if(slow('s1',gate)!==station(1).check){ b.textContent='Começar a rota'; b.disabled=false; showModal('<h2>QR inválido</h2><p style="margin-top:10px">Leia de novo o QR code mostrado pelo professor.</p><button class="primary" type="button" onclick="hideModal()">Ok</button>'); return; }
      S=newState($('name').value.trim().replace(/\s+/g,' '),0,{1:gate}); save(); route();
    },30);
  };
}
function tryGate(n,pw,fresh,name){
  const gate=n===NST? norm(pw)+'|P' : norm(pw)+'|'+QK;
  if(slow('s'+n,gate)!==station(n).check) return false;
  if(fresh){ S=newState(name,n-1,{}); S.resumed=true; }
  if(S.stage<n-1){ S.stage=n-1; }
  S.next=null; S.keys[n]=gate; S.ch=0; save(); return true;
}
function screenGate(n){
  const fresh=!S;
  if(!fresh && S.next && S.next.senha){ // progresso salvo: a senha já é conhecida
    $('hud').classList.add('hidden'); view('<main><article class="sheet"><h2>Abrindo a estação '+n+'…</h2></article></main>');
    setTimeout(()=>{ if(tryGate(n,S.next.senha,false)){ route(); } else { renderGate(n,fresh,'Este QR não é o da estação '+n+'. Confira o local: a charada da estação anterior indica outro lugar.'); } },40);
    return;
  }
  renderGate(n,fresh,'');
}
function renderGate(n,fresh,warn){
  if(!fresh) renderHud('<b>Estação '+n+' de '+NST+'</b>'); else $('hud').classList.add('hidden');
  view('<main><article class="sheet"><div class="kicker">Estação '+n+': '+esc(D.places[n]||'')+'</div><h2>Porta trancada</h2>'+(warn?'<div class="msg err">'+esc(warn)+'</div>':'')+'<p class="story">Digite a senha recebida no fim da estação '+(n-1)+'.</p>'+
    (fresh?'<p class="muted" style="font-size:15px">Este navegador não tem o seu progresso (trocou de celular ou de navegador, ou o histórico foi apagado). Digite seu nome e a senha para continuar daqui.</p><label class="lbl" for="name">Seu nome completo</label><input class="answer" id="name" autocomplete="name" placeholder="Nome e sobrenome" style="font-size:18px;letter-spacing:0"><label class="lbl" for="pw">Senha</label>':'')+
    '<input class="answer" id="pw" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Senha"><div id="fb"></div><button class="primary" id="btnPw" type="button" disabled>Abrir estação</button></article></main>');
  const i=$('pw');
  const ok=()=>!!i.value.trim()&&(!fresh||nameOk($('name').value));
  const upd=()=>{$('btnPw').disabled=!ok();};
  i.oninput=upd; if(fresh) $('name').oninput=upd;
  i.onkeydown=e=>{if(e.key==='Enter'&&ok())go();};
  $('btnPw').onclick=go;
  function go(){
    const b=$('btnPw'); b.disabled=true; b.textContent='Verificando…';
    setTimeout(()=>{
      if(tryGate(n,i.value,fresh,fresh?$('name').value.trim().replace(/\s+/g,' '):'')){ route(); return; }
      b.textContent='Abrir estação'; b.disabled=false;
      $('fb').innerHTML='<div class="msg err">Senha incorreta para este QR. Confira a senha da estação '+(n-1)+' e se este é o QR da estação '+n+'.</div>';
    },30);
  }
}
function revealBtn(n){

let sel=null, seq=[], pairs={}, activeLeft=null, wsA=null, bins={}, multi=[];
function curCh(){ return ST.challenges[S.ch]; }
const NOBTN=['keys','wordsearch','memory','termo'];
function screenChallenge(){
  const n=S.stage+1, L=curCh(); sel=null; seq=[]; pairs={}; activeLeft=null; wsA=null; bins={}; multi=[];
  renderHud('<b>Estação '+n+' de '+NST+'</b>desafio '+(S.ch+1)+' de '+ST.challenges.length);
  $('btnHint').disabled=!!S.hints[L.id];
  let h='<main><article class="sheet" id="sheet"><div class="kicker">Estação '+n+': '+esc(ST.title)+'</div><h2>'+esc(L.title)+'</h2>';
  if(S.ch===0) h+='<p class="story">'+esc(ST.intro)+'</p>';
  h+='<p class="story">'+esc(L.story)+'</p>';
  if(L.type==='final') h+='<p>Etiquetas coletadas: <b style="letter-spacing:.25em;font-size:20px">'+esc(S.letters.join(''))+'</b></p>';
  h+='<p class="prompt">'+esc(L.prompt)+'</p><div id="area"></div>';
  h+='<div id="hintBox">'+(S.hints[L.id]?'<div class="msg hint"><b>Dica:</b> '+esc(L.hint)+'</div>':'')+'</div><div id="fb"></div>';

}
function drawArea(){
  const L=curCh(), a=$('area'); let h='';
  if(L.type==='text'||L.type==='final'){
    a.innerHTML='<input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="'+(L.inputmode||'text')+'" placeholder="'+esc(L.placeholder||'')+'">';
    const i=$('ans'); i.oninput=()=>{$('btnGo').disabled=!i.value.trim();}; i.onkeydown=e=>{if(e.key==='Enter'&&i.value.trim())submit();}; return;
  }
  if(L.type==='mc'){
    a.innerHTML=L.options.map((o,k)=>'<button type="button" class="choice'+(sel===o.id?' sel':'')+'" data-id="'+o.id+'"><span class="n">'+'ABCDE'[k]+'</span>'+esc(o.t)+'</button>').join('');
    a.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{sel=b.dataset.id; drawArea(); $('btnGo').disabled=false;}); return;
  }
  if(L.type==='multi'){
    a.innerHTML=L.options.map(o=>'<button type="button" aria-pressed="'+(multi.includes(o.id))+'" class="choice chk'+(multi.includes(o.id)?' sel':'')+'" data-id="'+o.id+'">'+esc(o.t)+'</button>').join('')+'<p class="muted" style="font-size:14px">'+multi.length+' marcada(s)</p>';
    a.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const id=b.dataset.id,p=multi.indexOf(id); if(p>=0) multi.splice(p,1); else multi.push(id); drawArea();});
    $('btnGo').disabled=!multi.length; return;
  }
  if(L.type==='sort'||L.type==='vf'){
    const opts=L.type==='vf'?[{id:'v',t:'V'},{id:'f',t:'F'}]:L.bins;
    const list=L.type==='vf'?L.statements:L.items;
    a.innerHTML=list.map((t,k)=>'<div class="item"><p>'+(L.type==='vf'?(k+1)+'. ':'')+esc(t)+'</p><div class="bins'+(L.type==='vf'?' vf':'')+'" role="group">'+opts.map(o=>'<button type="button" aria-pressed="'+(bins[k]===o.id)+'" class="'+(bins[k]===o.id?'sel':'')+'" data-k="'+k+'" data-b="'+o.id+'">'+esc(o.t)+'</button>').join('')+'</div></div>').join('');
    a.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{ bins[+b.dataset.k]=b.dataset.b; const y=window.scrollY; drawArea(); window.scrollTo(0,y); });
    $('btnGo').disabled=Object.keys(bins).length!==list.length; return;
  }
  if(L.type==='termo'){ drawTermo(L,a); return; }
  if(L.type==='memory'){ drawMemory(L,a); return; }
  if(L.type==='keys'){
    const bad=S.bad[L.id]||[];
    const ico='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="7.5" cy="12" r="4"/><path d="M11.5 12H21M17 12v3M20 12v2"/></svg>';
    a.innerHTML='<div class="keys">'+L.options.map(o=>'<button type="button" class="key'+(bad.includes(o.id)?' bad':'')+'" data-id="'+o.id+'"'+(bad.includes(o.id)?' disabled':'')+'>'+ico+esc(o.t)+'</button>').join('')+'</div>';
    a.querySelectorAll('.key').forEach(b=>b.onclick=()=>tryKey(b.dataset.id)); return;
  }
  if(L.type==='order'){
    h='<p class="colhead">Toque para adicionar ou remover da sequência</p>'+L.cards.map(c=>{const p=seq.indexOf(c.id);return '<button type="button" class="choice'+(p>=0?' sel':'')+'" data-id="'+c.id+'">'+(p>=0?'<span class="n">'+(p+1)+'</span>':'')+esc(c.t)+'</button>';}).join('');
    h+=seq.length?'<button type="button" class="secondary" id="clr">Limpar sequência</button>':'';
    a.innerHTML=h;
    a.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const id=b.dataset.id,p=seq.indexOf(id); if(p>=0) seq.splice(p,1); else seq.push(id); drawArea();});
    if($('clr')) $('clr').onclick=()=>{seq=[];drawArea();};
    $('btnGo').disabled=seq.length!==L.cards.length; return;
  }
  if(L.type==='assoc'){
    const used=Object.values(pairs);
    h='<p class="colhead">1. Escolha o item</p>'+L.left.map((t,k)=>{const r=L.right.find(x=>x.id===pairs[k]);return '<button type="button" class="choice'+(activeLeft===k?' sel':'')+'" data-l="'+k+'"><b>'+esc(t)+'</b>'+(r?'<span class="pair-target">→ '+esc(r.t)+'</span>':'')+'</button>';}).join('');
    h+='<p class="colhead">2. Toque no par'+(activeLeft!==null?' de <b>'+esc(L.left[activeLeft])+'</b>':'')+'</p>'+L.right.map(r=>'<button type="button" class="choice'+(used.includes(r.id)?' used':'')+'" data-r="'+r.id+'"'+(activeLeft===null?' disabled':'')+'>'+esc(r.t)+'</button>').join('');
    a.innerHTML=h;
    a.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{activeLeft=+b.dataset.l; drawArea();});
    a.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ if(activeLeft===null) return; const id=b.dataset.r;
      for(const k in pairs) if(pairs[k]===id) delete pairs[k];
      pairs[activeLeft]=id; const nx=L.left.findIndex((_,k)=>pairs[k]===undefined); activeLeft=nx>=0?nx:null; drawArea(); });
    $('btnGo').disabled=Object.keys(pairs).length!==L.left.length; return;
  }
  if(L.type==='wordsearch'){
    const found=S.ws[L.id]||{}, cells=new Set();
    Object.values(found).forEach(f=>f.c.forEach(x=>cells.add(x)));
    h='<div class="ws" role="grid">';
    for(let r=0;r<9;r++) for(let c=0;c<9;c++){ const id=r*9+c; h+='<button type="button" data-c="'+id+'" class="'+(cells.has(id)?'f':'')+(wsA===id?' a':'')+'" aria-label="linha '+(r+1)+' coluna '+(c+1)+'">'+L.grid[r][c]+'</button>'; }
    h+='</div><ol class="clues">'+L.clues.map((t,i)=>'<li>'+esc(t)+(found[i]?' <b>'+esc(found[i].w.toUpperCase())+'</b>':'')+'</li>').join('')+'</ol>';
    h+='<p class="muted" style="font-size:14px">'+Object.keys(found).length+' de '+L.clues.length+' encontradas</p>';
    a.innerHTML=h;
    a.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>wsTap(+b.dataset.c)); return;
  }
}
function wsTap(id){
  const L=curCh();
  if(wsA===null){ wsA=id; drawArea(); return; }
  const r1=Math.floor(wsA/9),c1=wsA%9,r2=Math.floor(id/9),c2=id%9; wsA=null;
  const dr=Math.sign(r2-r1), dc=Math.sign(c2-c1), len=Math.max(Math.abs(r2-r1),Math.abs(c2-c1))+1;
  if(!(r1===r2||c1===c2||Math.abs(r2-r1)===Math.abs(c2-c1))||len<2){ drawArea(); return; }
  let w='', cs=[]; for(let i=0;i<len;i++){ const r=r1+dr*i,c=c1+dc*i; w+=L.grid[r][c]; cs.push(r*9+c); }
  w=w.toLowerCase(); const rw=w.split('').reverse().join('');
  const found=S.ws[L.id]=S.ws[L.id]||{};
  for(const cand of [w,rw]){ const hh=sha(D.salt+L.id+'w'+cand); const i=L.wh.indexOf(hh); if(i>=0&&!found[i]){ found[i]={w:cand,c:cs}; break; } }
  save(); drawArea();
  if(Object.keys(found).length===L.clues.length){
    const ans=L.clues.map((_,i)=>found[i].w).join('-');
    setTimeout(()=>{ if(slow(L.id,ans)===L.check) solved(L,ans); },50);
  }
}
function termoColors(L,w){ return w.split('').map((ch,i)=> sha(D.salt+L.id+'p'+i+':'+ch)===L.pos[i]?'g':(L.has.indexOf(sha(D.salt+L.id+'h'+ch))>=0?'y':'x')); }
function drawTermo(L,a){
  const G=(S.termo=S.termo||{})[L.id]=S.termo[L.id]||[];
  let h='<div class="tm">'+G.map(w=>{ const c=termoColors(L,w); return '<div class="row">'+w.split('').map((ch,i)=>'<div class="t '+c[i]+'">'+ch.toUpperCase()+'</div>').join('')+'</div>'; }).join('')+'</div>';
  h+='<input class="answer" id="tmIn" maxlength="'+L.len+'" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="'+L.len+' letras"><button class="primary" id="tmGo" type="button" disabled>Testar palavra</button>';
  h+='<p class="muted" style="font-size:14px;margin-top:8px">Tentativas: '+G.length+(G.length>=6?' (a partir de agora cada tentativa conta como erro)':' de 6')+'</p>';
  a.innerHTML=h; const i=$('tmIn');
  const val=()=>norm(i.value).replace(/[^a-z]/g,'');
  i.oninput=()=>{ $('tmGo').disabled=val().length!==L.len; };
  const go=()=>{ const w=val(); if(w.length!==L.len) return; if(G.length>=6) S.errors++; G.push(w); save(); drawTermo(L,a);
    if(termoColors(L,w).every(c=>c==='g')) setTimeout(()=>{ if(slow(L.id,w)===L.check) solved(L,w); },60); };
  $('tmGo').onclick=go; i.onkeydown=e=>{ if(e.key==='Enter') go(); };
}
let memOpen=[], memBusy=false;
function drawMemory(L,a){
  const M=(S.mem=S.mem||{})[L.id]=S.mem[L.id]||[];
  a.innerHTML='<div class="mem">'+L.cards.map((c,i)=>{ const ok=M.indexOf(i)>=0, up=memOpen.indexOf(i)>=0; return '<button type="button" data-m="'+i+'" class="'+(ok?'ok':up?'up':'')+'"'+(ok?' disabled':'')+' aria-label="'+(ok||up?esc(c.t):'carta virada')+'">'+esc(c.t)+'</button>'; }).join('')+'</div><p class="muted" style="font-size:14px">'+(M.length/2)+' de '+(L.cards.length/2)+' pares</p>';
  a.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.m; if(memBusy||memOpen.indexOf(i)>=0||M.indexOf(i)>=0) return;
    memOpen.push(i); drawMemory(L,a);
    if(memOpen.length===2){ const [x,y]=memOpen;
      if(L.cards[x].p===L.cards[y].p){ M.push(x,y); memOpen=[]; save(); drawMemory(L,a);
        if(M.length===L.cards.length) setTimeout(()=>{ if(slow(L.id,'memoria-ok')===L.check) solved(L,'memoria-ok'); },60); }
      else { memBusy=true; setTimeout(()=>{ memOpen=[]; memBusy=false; drawMemory(L,a); },1100); } }
  });
}
function screenChallengeHudOnly(){ const n=S.stage+1; renderHud('<b>Estação '+n+' de '+NST+'</b>desafio '+(S.ch+1)+' de '+ST.challenges.length); }
function shake(){ const sh=$('sheet'); if(!sh) return; sh.classList.remove('shake'); void sh.offsetWidth; sh.classList.add('shake'); }
function tryKey(id){
  const L=curCh(); $('fb').innerHTML='<div class="msg">Testando a chave…</div>';
  setTimeout(()=>{
    if(slow(L.id,id)===L.check){ solved(L,id); return; }
    S.errors++; S.penalty=(S.penalty||0)+30; (S.bad[L.id]=S.bad[L.id]||[]).push(id); save();
    $('fb').innerHTML='<div class="msg err"><b>+30 s.</b> '+esc(L.feedback)+'</div>'; drawArea(); shake();
  },30);
}
function currentAnswer(){
  const L=curCh();
  if(L.type==='text'){ let v=$('ans').value; if(L.inputmode==='decimal'||L.inputmode==='numeric') v=v.replace(/[^0-9.,\-]/g,''); return norm(v); }
  if(L.type==='final') return norm($('ans').value);
  if(L.type==='mc') return sel;
  if(L.type==='multi') return multi.slice().sort().join('-');
  if(L.type==='order') return seq.join('-');
  if(L.type==='assoc') return L.left.map((_,k)=>pairs[k]).join('-');
  if(L.type==='sort'||L.type==='vf') return (L.type==='vf'?L.statements:L.items).map((_,k)=>bins[k]).join('-');
}
function submit(){
  const L=curCh(), ans=currentAnswer(); if(!ans) return;
  const btn=$('btnGo'); btn.disabled=true; btn.textContent='Verificando…';
  setTimeout(()=>{
    if(slow(L.id,ans)===L.check){ solved(L,ans); return; }
    btn.textContent='Abrir cadeado'; S.errors++; save();
    let extra='';
    if(L.parts){ let c=0; ans.split('-').forEach((p,k)=>{ if(sha(D.salt+L.id+'p'+k+':'+p)===L.parts[k]) c++; });
      extra='<b>'+c+' de '+L.parts.length+(L.type==='order'?' na posição certa.':' certas.')+'</b> '; }
    $('fb').innerHTML='<div class="msg err">'+extra+esc(L.feedback)+'</div>'; shake();
    btn.disabled=false; $('fb').scrollIntoView({block:'nearest',behavior:'smooth'});
  },30);
}
function solved(L,ans){
  const r=dec(L.id,ans,L.secret);
  if(r.l) S.letters.push(r.l);
  const last=S.ch===ST.challenges.length-1, n=S.stage+1;
  if(last){ S.doneSt=S.doneSt||[]; if(S.doneSt.indexOf(n)<0) S.doneSt.push(n); }
  if(L.type==='final'){ S.done=true; S.doneAt=Math.floor((Date.now()-S.start)/1000); S.finalText=r.u; save(); finish(); return; }
  if(last){ S.stage=n; S.ch=0; S.next={riddle:r.riddle,senha:r.senha,place:r.place}; } else S.ch++;
  save();
  renderHud('<b>Estação '+n+' de '+NST+'</b>');
  view('<main><article class="sheet okb"><div class="kicker" style="color:var(--ok)">Cadeado aberto</div><h2>'+esc(L.title)+'</h2><div class="msg ok" style="margin-top:14px">'+(r.l?'<span class="letter">'+esc(r.l)+'</span>':'')+esc(r.u)+'</div><button class="primary" id="btnNext" type="button">'+(last?'Ver o próximo destino':'Ir para o desafio '+(S.ch+1))+'</button></article></main>');
  $('btnNext').onclick=route;
}

/* ---- Código de verificação ---- */
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function initial(name){ const c=norm(name).replace(/[^a-z]/g,'')[0]; return c?c.toUpperCase():'X'; }
function stMask(){ return (S.doneSt||[]).reduce((m,k)=>m|(1<<(k-1)),0); }
function makeCode(name,t,hints,errs,late,mask){
  const ini=initial(name);
  const p=((((Math.min(Math.floor(t/10),1023)*32+Math.min(hints,31))*64+Math.min(errs,63))*2+(late?1:0))*64)+mask;
  const mk=parseInt(sha(D.secret+'m8'+ini).slice(0,7),16)%268435456;
  const mac=parseInt(sha(D.secret+'c8'+ini+':'+p).slice(0,3),16);
  let v=(p^mk)*4096+mac, s='';
  for(let i=0;i<8;i++){ s=ALPH[v%32]+s; v=Math.floor(v/32); }
  return ini+'-'+s;
}
function progressCode(){ const h=hintsUsed(), el=elapsed(); return makeCode(S.name,el+h*60+(S.penalty||0),h,S.errors,el>D.minutes*60,stMask()); }
function stList(){ const d=(S.doneSt||[]).slice().sort(); return d.length===NST?'todas (1 a '+NST+')':d.join(', ')+' de '+NST; }
function finish(){
  $('hud').classList.add('hidden');
  const hints=hintsUsed(), total=S.doneAt+hints*60+(S.penalty||0), late=S.doneAt>D.minutes*60;
  const code=makeCode(S.name,total,hints,S.errors,late,stMask());
  view('<div style="padding:24px 0"><h1>'+(late?'Rota fechada, fora do tempo':'Rota fechada!')+'</h1><p class="story">'+esc(S.finalText||'')+'</p>'+
   '<dl class="stats"><dt>Nome</dt><dd>'+esc(S.name)+'</dd><dt>Estações concluídas</dt><dd>'+esc(stList())+'</dd><dt>Tempo final</dt><dd>'+fmt(total)+'</dd><dt>Dicas usadas</dt><dd>'+hints+'</dd><dt>Erros</dt><dd>'+S.errors+'</dd></dl>'+
   '<p style="margin-top:18px;font-weight:650">Código de verificação</p><div class="code" id="code">'+code+'</div>'+
   '<p class="muted" style="font-size:14px">Mostre este código ao professor.</p>'+
   '<button class="primary" type="button" id="btnCopy">Copiar código</button>'+
   '<button class="secondary" type="button" id="btnReset">Jogar de novo</button></div>');
  $('btnCopy').onclick=()=>{ const ok=()=>{$('btnCopy').textContent='Código copiado';};
    if(navigator.clipboard) navigator.clipboard.writeText(code).then(ok,()=>prompt('Copie:',code)); else prompt('Copie:',code); };
  $('btnReset').onclick=()=>{ showModal('<h2>Apagar resultado?</h2><p style="margin-top:10px">Seu código atual some deste celular. Mostre ao professor antes.</p><button class="primary" type="button" id="yes">Apagar e recomeçar</button><button class="secondary" type="button" onclick="hideModal()">Cancelar</button>');
    $('yes').onclick=()=>{ try{localStorage.removeItem(KEY);}catch(e){} location.href=location.pathname; }; };
}

/* ---- Roteador ---- */
$('btnHint').onclick=()=>{
  const L=ST&&curCh(); if(!L||S.hints[L.id]) return;
  showModal('<h2>Usar a dica?</h2><p style="margin-top:10px">A dica soma 1 minuto ao tempo final.</p><button class="primary" type="button" id="yesHint">Mostrar dica</button><button class="secondary" type="button" onclick="hideModal()">Agora não</button>');
  $('yesHint').onclick=()=>{ S.hints[L.id]=1; save(); hideModal(); $('hintBox').innerHTML='<div class="msg hint"><b>Dica:</b> '+esc(L.hint)+'</div>'; $('btnHint').disabled=true; screenChallengeHudOnly(); };
};
function route(){
  ST=null; $('btnHint').disabled=true;
  if(S&&S.done){ finish(); return; }
  if(QE===1&&QK&&!S){ screenIntro(); return; }
  if(QE>1&&QE<NST&&QK&&!S){ screenGate(QE); return; }
  if(!S){ screenNoState(); return; }
  const n=S.stage+1;
  if(QE>1&&QE<NST&&QK&&QE===n&&!S.keys[n]){ screenGate(QE); return; }
  if(QE>n&&QE<NST&&QK&&!S.keys[n]&&!wrongShown){ wrongShown=true; screenTravel('Este é o QR da estação '+QE+' ('+(D.places[QE]||'')+'), mas você ainda está a caminho da estação '+n+'. Siga a charada abaixo.'); return; }
  if(S.keys[n]){ openStation(n);
    if(S.ch===0 && S.letters.length<ST.prev.length){ S.letters=ST.prev.slice(); save(); }
    screenChallenge(); return; }
  if(n===NST){ screenProf(); return; }
  screenTravel();
}
load(); route();
</script>
